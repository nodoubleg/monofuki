name: Build fonts

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fonts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            fontforge python3-fontforge python3-fonttools ttfautohint woff2 curl unzip

      - name: Test supervised native handoff gates
        run: python3 -m unittest discover -s script_helper -p test_native_handoff.py -v

      - name: Check source glyphs
        run: |
          fontforge -lang=py -script script_helper/assemble_sources.py
          fontforge -lang=py -script script_helper/assemble_sources.py --check
          fontforge -lang=py -script script_helper/test_source_preservation.py
          fontforge -lang=py -script script_helper/test_upstream_conflicts.py
          python3 script_helper/check_unicode_data.py
          fontforge -lang=py -script script_helper/check_terminal_glyphs.py

      - name: Build all four styles with hinting
        run: ./create_font.sh --hint

      - name: Validate regular font exports
        run: |
          for style in Regular Italic Bold Bold-Italic; do
            for suffix in .ttf -hinted.ttf .otf .woff2 -hinted.woff2; do
              test -s "export/Monofuki-${style}${suffix}"
            done
          done
          test -s export/LICENSE-Monofuki
          test -s export/LICENSE-Iosevka
          test -s export/LICENSE-NotoSansSymbols2
          test -s export/LICENSE-KreativeSquare
          python3 script_helper/check_font_names.py export/Monofuki-*.ttf export/Monofuki-*.otf
          fontforge -lang=py -script script_helper/check_terminal_glyphs.py \
            export/*.ttf export/*.otf

      - name: Audit regular emoji mappings
        run: python3 script_helper/audit_emoji.py export/Monofuki-*.otf --output export/emoji-audit.json --cases export/emoji-cases.json

      - name: Build and validate Nerd Font variants
        run: |
          ./post_create_nerdfonts.sh
          for style in Regular Italic Bold BoldItalic; do
            test -s "export/MonofukiNerdFont-${style}.ttf"
            test -s "export/MonofukiNerdFont-${style}.otf"
            woff2_compress "export/MonofukiNerdFont-${style}.otf"
            test -s "export/MonofukiNerdFont-${style}.woff2"
          done
          test -s export/LICENSE-nerd-font
          test -s export/license-audit-nerd-font.md
          fontforge -lang=py -script script_helper/check_terminal_glyphs.py \
            export/MonofukiNerdFont-*.ttf export/MonofukiNerdFont-*.otf

      - name: Compile and verify the approved tuning
        run: |
          sudo apt-get install --no-install-recommends -y python3-venv
          python3 -m venv .font-build/tuning-python
          .font-build/tuning-python/bin/pip install fonttools==4.56.0 brotli==1.2.0 uharfbuzz==0.56.3
          .font-build/tuning-python/bin/python script_helper/build_tuned_fonts.py
          .font-build/tuning-python/bin/python script_helper/test_tuning.py --all-profiles
          .font-build/tuning-python/bin/python script_helper/test_spacing_safety.py
          .font-build/tuning-python/bin/python script_helper/test_symbol_runs.py
          .font-build/tuning-python/bin/python script_helper/test_woff2_compression.py
          .font-build/tuning-python/bin/python script_helper/test_spacing_masks.py
          .font-build/tuning-python/bin/python script_helper/test_bold_small_n.py
          .font-build/tuning-python/bin/python script_helper/check_visible_glyphs.py export/Monofuki-*.ttf export/Monofuki-*.otf export/Monofuki-*.woff2 export/MonofukiNerdFont-*.ttf export/MonofukiNerdFont-*.otf export/MonofukiNerdFont-*.woff2
          node script_helper/test_site_ui.cjs
          python3 script_helper/check_font_names.py export/Monofuki-*.ttf export/Monofuki-*.otf export/MonofukiNerdFont-*.ttf export/MonofukiNerdFont-*.otf
          fontforge -lang=py -script script_helper/check_terminal_glyphs.py --tuned export/Monofuki-*.ttf export/Monofuki-*.otf export/MonofukiNerdFont-*.ttf export/MonofukiNerdFont-*.otf

      - name: Audit all emoji mappings
        run: python3 script_helper/audit_emoji.py export/Monofuki-*.otf export/MonofukiNerdFont-*.otf --output export/emoji-audit.json --cases export/emoji-cases.json

      - name: Export site character catalogues
        run: |
          python3 script_helper/export_character_catalog.py \
            --regular export/Monofuki-Regular.otf \
            --nerd export/MonofukiNerdFont-Regular.otf \
            --glyphnames .font-build/nerd-font-patcher/glyphnames.json \
            --output export/character-catalog.json

      - name: Upload regular Monofuki
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Monofuki-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            export/Monofuki-*
            export/tuning-base/Monofuki-*
            export/LICENSE-*
            export/NOTICES-symbols.md
            export/symbol-additions.json
            export/build-dependencies.json
            export/THIRD-PARTY-NOTICES.txt
            export/component-notices/
            export/component-provenance.json
            export/source-provenance.json
            export/glyph-provenance.json
            export/upstream-decisions.json
            export/source-overlays.json
            export/emoji-audit.json
            export/emoji-cases.json
            export/tuning-settings.json
            export/tuning-provenance.json
            export/export-repair-provenance.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Monofuki Nerd Font
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MonofukiNerdFont-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            export/MonofukiNerdFont-*
            export/tuning-base/MonofukiNerdFont-*
            export/tuning-settings.json
            export/tuning-provenance.json
            export/export-repair-provenance.json
            export/LICENSE-*
            export/NOTICES-symbols.md
            export/symbol-additions.json
            export/build-dependencies.json
            export/character-catalog.json
            export/license-audit-nerd-font.md
            export/THIRD-PARTY-NOTICES.txt
            export/component-notices/
            export/component-provenance.json
            export/source-provenance.json
            export/glyph-provenance.json
            export/upstream-decisions.json
            export/source-overlays.json
            export/nerd-policy.json
            export/emoji-audit.json
            export/emoji-cases.json
          if-no-files-found: error
          retention-days: 30

      - name: Report supervised native verification command
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          {
            echo '## Linux build complete; native verification pending'
            echo 'Pages stays unchanged until the repository owner verifies these exact artifacts on the connected Mac and submits the proof.'
            echo '```sh'
            echo "python3 script_helper/verify_on_mac.py check $BUILD_RUN_ID --output /path/to/new/native-$BUILD_RUN_ID-$BUILD_ATTEMPT"
            echo "python3 script_helper/verify_on_mac.py submit /path/to/new/native-$BUILD_RUN_ID-$BUILD_ATTEMPT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
